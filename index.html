<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo que dice y lo que hace</title>
<meta name="description" content="Una prueba de 30 segundos para vivir lo que Diego Villarroel, diseñador UX/UI, ve en cada prueba con usuarios. Elementos de Psicología · FADU-UBA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>

body{margin:0;background:#111114}
a{color:#FF5A45}a:hover{color:#F2F2EF}
html{scroll-behavior:smooth}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.rec{animation:rec 1.2s steps(1) infinite}
.palabra{display:inline-block;opacity:0;transform:translateY(.35em);animation:palabra .6s cubic-bezier(.2,.8,.2,1) forwards}
.paso{animation:paso .4s cubic-bezier(.3,1.3,.5,1) both}
.salto{transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .22s,background .2s}
.salto:hover{transform:translateY(-3px)}
.salto:active{transform:translateY(1px) scale(.98)}
.nota{animation:nota 3.4s ease both}
.barra{transform-origin:center bottom}
.sonando{animation:onda .7s ease-in-out infinite alternate}
.w{transition-property:color;transition-duration:.25s}
.candado{animation:candado 2.6s ease-in-out infinite;transform-origin:50% 30%}
@keyframes rec{50%{opacity:.2}}
@keyframes palabra{to{opacity:1;transform:none}}
@keyframes paso{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes nota{0%{opacity:0;transform:translateY(8px)}10%,82%{opacity:1;transform:none}100%{opacity:0}}
@keyframes onda{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes candado{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-10deg)}82%{transform:rotate(8deg)}88%{transform:rotate(-4deg)}}
@keyframes sube{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:.12}to{opacity:1}}
@supports (animation-timeline: view()){
.revela{animation:sube linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
.wscroll{animation:aparece linear both;animation-timeline:view()}
}
@media (max-width:600px){
.marco{padding:6px!important;border-radius:40px!important;height:620px!important}
.marco>div{border-radius:34px!important}
.panel{min-height:0!important;gap:56px!important}
.cita{padding:24px 20px!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.palabra{opacity:1;transform:none}}

</style>
</head>
<body>
<div id="app"></div>
<script type="text/template" id="plantilla">
<div style="font-family: Figtree, sans-serif; color: #F2F2EF; background: #111114; overflow-x: hidden;">

<!-- BARRA -->
<div style="max-width: 1240px; margin: 0 auto; padding: 24px clamp(20px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px;">
  <span style="display: inline-flex; align-items: center; gap: 10px; font: 600 12px/1.4 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #F2F2EF;"><span class="rec" style="width: 10px; height: 10px; border-radius: 50%; background: #FF3B2F;"></span>REC · ENTREVISTA A DIEGO VILLARROEL</span>
  <span style="font: 500 12px/1.4 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #9A9AA0;">ELEMENTOS DE PSICOLOGÍA · FADU-UBA</span>
</div>

<!-- 01 · PORTADA -->
<section style="max-width: 1240px; margin: 0 auto; padding: clamp(40px, 7vw, 96px) clamp(20px, 4vw, 48px) clamp(72px, 9vw, 120px); box-sizing: border-box; display: flex; flex-direction: column; gap: clamp(32px, 4vw, 48px);">
  <h1 style="margin: 0; font: 800 clamp(76px, 15vw, 210px)/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0;">
    <span style="display: block; color: #F2F2EF;"><sc-for list="{{tituloA}}" as="w" hint-placeholder-count="3"><span class="palabra" style="animation-delay: {{w.d}}s; margin-right: .18em;">{{w.t}}</span></sc-for></span>
    <span style="display: block; color: #FF3B2F;"><sc-for list="{{tituloB}}" as="w" hint-placeholder-count="4"><span class="palabra" style="animation-delay: {{w.d}}s; margin-right: .18em;">{{w.t}}</span></sc-for></span>
  </h1>
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px 64px;">
    <p style="margin: 0; flex: 1 1 380px; max-width: 620px; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.55; color: #C9C9CE;">Diego diseña interfaces hace cuatro años y prueba sus pantallas con personas reales. Nos contó que lo que la gente dice y lo que hace no siempre coinciden. Podés leerlo, o podés <strong style="color: #F2F2EF;">vivirlo en 30&nbsp;segundos.</strong></p>
    <div style="display: flex; flex-wrap: wrap; gap: 12px;">
      <a class="salto" href="#prueba" style="display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 28px; border-radius: 999px; background: #FF3B2F; color: #111114; font: 700 17px Figtree, sans-serif; text-decoration: none;">Hacer la prueba
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
      </a>
      <a class="salto" href="#testimonio" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 24px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #5A5A60; color: #F2F2EF; font: 600 16px Figtree, sans-serif; text-decoration: none;">Prefiero escuchar a Diego</a>
    </div>
  </div>
</section>

<!-- 02 · LA PRUEBA -->
<section id="prueba" style="background: #F2F2EF; color: #111114;">
  <div style="max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 112px) clamp(20px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px;">
    <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 28px; min-width: 0;">
      <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #C42A1E;">01 · LA PRUEBA</span>
      <h2 style="margin: 0; font: 800 clamp(56px, 7.5vw, 104px)/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">Cancelá tu suscripción</h2>
      <p style="margin: 0; max-width: 480px; font-size: 19px; line-height: 1.55; color: #46464C;">Una tarea concreta y nadie que te ayude: así son las pruebas que hace Diego. Mientras la hacés, esta página observa. Al final te preguntamos cómo te fue.</p>
      <div style="border-radius: 20px; padding: 20px 22px; background: #111114; color: #F2F2EF; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
          <span style="display: inline-flex; align-items: center; gap: 8px; font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .12em;"><span class="{{recClass}}" style="width: 9px; height: 9px; border-radius: 50%; background: {{recColor}};"></span>{{recLabel}}</span>
          <span style="font: 600 22px 'IBM Plex Mono', monospace; color: #F2F2EF;">{{reloj}}</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1 1 0; border-radius: 12px; padding: 12px; background: #1E1E23; display: flex; flex-direction: column; gap: 4px;"><span style="font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .1em; color: #9A9AA0;">TOQUES</span><span style="font: 600 18px 'IBM Plex Mono', monospace;">{{obsToques}}</span></div>
          <div style="flex: 1 1 0; border-radius: 12px; padding: 12px; background: #1E1E23; display: flex; flex-direction: column; gap: 4px;"><span style="font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .1em; color: #9A9AA0;">PANTALLAS</span><span style="font: 600 18px 'IBM Plex Mono', monospace;">{{obsPantallas}}</span></div>
        </div>
        <span style="font-size: 13px; line-height: 1.4; color: #9A9AA0;">Los números se revelan cuando termines, igual que en una prueba real: el que observa no le muestra nada a quien prueba.</span>
      </div>
    </div>

    <div style="flex: 0 1 380px; width: 100%; max-width: 380px; margin: 0 auto;">
      <div class="marco" style="height: 660px; border-radius: 46px; padding: 11px; background: #111114; box-shadow: 0 40px 80px rgba(17,17,20,.28);">
        <div style="position: relative; height: 100%; border-radius: 36px; overflow: hidden; background: #FFFFFF; color: #1B1A2E; display: flex; flex-direction: column;">
          <div style="height: 34px; flex: 0 0 auto; display: flex; justify-content: center; align-items: center;"><div style="width: 96px; height: 24px; border-radius: 999px; background: #111114;"></div></div>

          <sc-if value="{{isIntro}}" hint-placeholder-val="{{true}}">
            <div class="paso" style="flex: 1 1 auto; padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between; background: #111114; color: #F2F2EF;">
              <div style="display: flex; flex-direction: column; gap: 18px;">
                <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #FF3B2F;">TU TAREA</span>
                <p style="margin: 0; font: 800 50px/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">Cancelá tu suscripción Premium.</p>
                <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #C9C9CE;">Sin apuro y sin ayuda. Vale equivocarse.</p>
              </div>
              <button class="salto" onClick="{{start}}" style="min-height: 58px; border: 0; border-radius: 18px; background: #FF3B2F; color: #111114; font-weight: 700; font-size: 17px;">Empezar</button>
            </div>
          </sc-if>

          <sc-if value="{{isApp}}" hint-placeholder-val="{{false}}">
            <div class="paso" style="flex: 1 1 auto; padding: 14px 20px 14px; display: flex; flex-direction: column; gap: 14px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font: 700 24px/1.2 Figtree, sans-serif;">Mi cuenta</span>
                <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; background: #E9E5FF; color: #5B3DF5; display: flex; align-items: center; justify-content: center; font-weight: 700;">M</span>
              </div>
              <div style="border-radius: 22px; padding: 20px; background: #5B3DF5; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px;">
                <span style="font: 600 11px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #DCD4FF;">TU PLAN</span>
                <span style="font: 700 30px/1.1 Figtree, sans-serif;">Premium</span>
                <span style="font-size: 14px; line-height: 1.4; color: #E9E5FF;">Se renueva el 12 de diciembre</span>
              </div>
              <button class="salto" onClick="{{tapSeguir}}" style="min-height: 56px; border: 0; border-radius: 16px; background: #1B1A2E; color: #FFFFFF; font-weight: 700; font-size: 16px;">Seguir disfrutando Premium</button>
              <button class="salto" onClick="{{tapBeneficios}}" style="min-height: 50px; border-radius: 16px; background: #F3F1FF; border: 0; color: #3F28C9; font-weight: 600; font-size: 15px;">Ver mis 12 beneficios</button>
              <sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
                <div class="nota" style="padding: 12px 14px; border-radius: 12px; background: #1B1A2E; color: #FFFFFF; font-size: 14px; line-height: 1.4;">{{note}}</div>
              </sc-if>
              <div style="flex: 1 1 auto;"></div>
              <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0 12px; border-top: 1px solid #ECEAF2; padding-top: 6px;">
                <button onClick="{{tapAyuda}}" style="min-height: 44px; border: 0; background: none; color: #6A6880; font-size: 12px;">Ayuda</button>
                <button onClick="{{tapPrivacidad}}" style="min-height: 44px; border: 0; background: none; color: #6A6880; font-size: 12px;">Privacidad</button>
                <button onClick="{{gestionar}}" style="min-height: 44px; border: 0; background: none; color: #6A6880; font-size: 12px;">Gestionar suscripción</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{isOferta}}" hint-placeholder-val="{{false}}">
            <div class="paso" style="flex: 1 1 auto; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: #F3F1FF;">
              <div style="display: flex; flex-direction: column; gap: 16px;">
                <span style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #5B3DF5; color: #FFFFFF; font: 600 11px 'IBM Plex Mono', monospace; letter-spacing: .12em;">OFERTA ESPECIAL</span>
                <p style="margin: 0; font: 700 34px/1.12 Figtree, sans-serif;">¡Esperá! Te regalamos un mes&nbsp;gratis.</p>
                <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4E4C66;">Quedate sin pagar nada y decidí más tranquilo.</p>
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <button class="salto" onClick="{{tapMesGratis}}" style="min-height: 58px; border: 0; border-radius: 16px; background: #5B3DF5; color: #FFFFFF; font-weight: 700; font-size: 17px;">Quiero mi mes gratis</button>
                <button onClick="{{noGracias}}" style="min-height: 44px; border: 0; background: none; color: #6A6880; font-size: 13px;">No, gracias. Cancelar igual</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{isAviso}}" hint-placeholder-val="{{false}}">
            <div class="paso" style="flex: 1 1 auto; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;">
              <div style="display: flex; flex-direction: column; gap: 16px;">
                <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #6A6880;">¿SEGURO?</span>
                <p style="margin: 0; font: 700 34px/1.12 Figtree, sans-serif;">Vas a perder tu racha de 34&nbsp;días.</p>
                <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;">
                  <sc-for list="{{racha}}" as="d" hint-placeholder-count="35">
                    <span style="aspect-ratio: 1; border-radius: 6px; background: {{d.c}};"></span>
                  </sc-for>
                </div>
                <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4E4C66;">Y el mes gratis que te ofrecimos. Tu yo de mañana te lo va a agradecer.</p>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="salto" onClick="{{tapMantener}}" style="min-height: 58px; border: 0; border-radius: 16px; background: #5B3DF5; color: #FFFFFF; font-weight: 700; font-size: 17px;">Mantener mi racha</button>
                <button class="salto" onClick="{{cancelar}}" style="min-height: 50px; border-radius: 16px; background: transparent; border: 1.5px solid #CFCBE0; color: #1B1A2E; font-weight: 600; font-size: 15px;">Cancelar suscripción</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{isHecho}}" hint-placeholder-val="{{false}}">
            <div class="paso" style="flex: 1 1 auto; padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between; background: #111114; color: #F2F2EF;">
              <div style="display: flex; flex-direction: column; gap: 16px;">
                <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #7EDB9A;">CANCELADA · FIN DE LA PRUEBA</span>
                <p style="margin: 0; font: 800 50px/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">¿Qué tan fácil te resultó?</p>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="salto" onClick="{{rFacil}}" style="min-height: 56px; border: 0; border-radius: 16px; background: #F2F2EF; color: #111114; font-weight: 700; font-size: 17px;">Re fácil</button>
                <button class="salto" onClick="{{rNormal}}" style="min-height: 56px; border: 0; border-radius: 16px; background: #2A2A30; color: #F2F2EF; font-weight: 700; font-size: 17px;">Normal</button>
                <button class="salto" onClick="{{rCosto}}" style="min-height: 56px; border: 0; border-radius: 16px; background: #2A2A30; color: #F2F2EF; font-weight: 700; font-size: 17px;">Me costó</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{isFin}}" hint-placeholder-val="{{false}}">
            <div class="paso" style="flex: 1 1 auto; padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between; background: #111114; color: #F2F2EF;">
              <div style="display: flex; flex-direction: column; gap: 16px;">
                <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #FF3B2F;">RESULTADO DESBLOQUEADO</span>
                <p style="margin: 0; font: 800 50px/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">Ahora mirá lo que hiciste.</p>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <a class="salto" href="#resultado" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #FF3B2F; color: #111114; font-weight: 700; font-size: 17px; text-decoration: none;">Ver mi resultado</a>
                <button onClick="{{reset}}" style="min-height: 44px; border: 0; background: none; color: #9A9AA0; font-size: 14px;">Repetir la prueba</button>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 03 · TU RESULTADO (se desbloquea con la prueba) -->
<section id="resultado" style="background: #111114;">
  <div style="max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 112px) clamp(20px, 4vw, 48px); box-sizing: border-box; display: flex; flex-direction: column; gap: 40px;">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;">
      <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #FF5A45;">02 · TU RESULTADO</span>
      <span style="padding: 8px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #5A5A60; font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #C9C9CE;">INCONSCIENTE</span>
    </div>

    <sc-if value="{{sinPrueba}}" hint-placeholder-val="{{true}}">
      <div style="position: relative; border-radius: 32px; padding: clamp(32px, 5vw, 64px); background: repeating-linear-gradient(135deg, #17171B 0 14px, #1B1B20 14px 28px); box-shadow: inset 0 0 0 1.5px #2E2E35; display: flex; flex-wrap: wrap; align-items: center; gap: 32px 48px;">
        <svg class="candado" width="88" height="104" viewBox="0 0 88 104" aria-hidden="true"><path d="M22 46V30a22 22 0 0 1 44 0v16" stroke="#F2F2EF" stroke-width="8" fill="none" stroke-linecap="round"></path><rect x="6" y="44" width="76" height="56" rx="14" fill="#FF3B2F"></rect><circle cx="44" cy="68" r="7" fill="#111114"></circle><rect x="40" y="70" width="8" height="16" rx="4" fill="#111114"></rect></svg>
        <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 14px;">
          <p style="margin: 0; font: 800 clamp(44px, 5.5vw, 72px)/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">Esta parte se desbloquea con la prueba</p>
          <p style="margin: 0; max-width: 540px; font-size: 18px; line-height: 1.55; color: #C9C9CE;">Acá aparece lo que dijiste al lado de lo que hiciste, y qué trampa había detrás de cada toque.</p>
        </div>
        <a class="salto" href="#prueba" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border-radius: 999px; background: #FF3B2F; color: #111114; font-weight: 700; text-decoration: none;">Hacer la prueba</a>
      </div>
    </sc-if>

    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div class="paso" style="display: flex; flex-direction: column; gap: 40px;">
        <div style="display: flex; flex-wrap: wrap; gap: 16px;">
          <div class="panel" style="flex: 1 1 340px; min-height: 320px; border-radius: 32px; padding: clamp(24px, 3vw, 40px); background: #F2F2EF; color: #111114; display: flex; flex-direction: column; justify-content: space-between; gap: 24px;">
            <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #46464C;">LO QUE DIJISTE</span>
            <p style="margin: 0; font: 800 clamp(80px, 11vw, 150px)/1 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">{{dijiste}}</p>
          </div>
          <div class="panel" style="flex: 1 1 340px; min-height: 320px; border-radius: 32px; padding: clamp(24px, 3vw, 40px); background: #FF3B2F; color: #111114; display: flex; flex-direction: column; justify-content: space-between; gap: 24px;">
            <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em;">LO QUE HICISTE</span>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
              <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 800 clamp(56px, 6.5vw, 88px)/1 'Saira Extra Condensed', sans-serif;">{{segundos}}</span><span style="font-size: 15px; line-height: 1.3; font-weight: 600;">segundos</span></div>
              <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 800 clamp(56px, 6.5vw, 88px)/1 'Saira Extra Condensed', sans-serif;">{{toques}}</span><span style="font-size: 15px; line-height: 1.3; font-weight: 600;">toques que te alejaban</span></div>
              <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 800 clamp(56px, 6.5vw, 88px)/1 'Saira Extra Condensed', sans-serif;">{{pantallas}}</span><span style="font-size: 15px; line-height: 1.3; font-weight: 600;">pantallas para irte</span></div>
            </div>
          </div>
        </div>
        <p style="margin: 0; max-width: 920px; font: 600 clamp(24px, 2.6vw, 34px)/1.3 Figtree, sans-serif;">{{veredicto}}</p>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <span style="font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #9A9AA0;">TU RECORRIDO, TOQUE POR TOQUE</span>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
            <sc-for list="{{recorrido}}" as="r" hint-placeholder-count="4">

      noGracias: () => this.toque('nogracias', { step: 'aviso', screens: this.state.screens + 1 }),
      tapMantener: wrongTap('mantener', 'Tu racha sigue viva. Seguís suscripto.'),
      cancelar: () => this.toque('cancelar', { step: 'hecho', screens: this.state.screens + 1, secs: Math.max(1, Math.round((Date.now() - this.state.t0) / 1000)) }),
      rFacil: go({ answer: 'facil', step: 'fin' }),
      rNormal: go({ answer: 'normal', step: 'fin' }),
      rCosto: go({ answer: 'costo', step: 'fin' }),
      reset: () => this.setState(this.inicial()),
      done, sinPrueba: !done,
      dijiste: done ? etiquetas[s.answer] : '',
      segundos: String(s.secs), toques: String(s.wrong), pantallas: String(s.screens),
      veredicto, recorrido, clips, final
    };
  }
}

</script>
